
name: Gerar APK - Reflexo Infinito

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extrair e compilar
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP não encontrado"
            exit 1
          fi
          unzip "$ZIP_FILE" -d source
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: reflexo-infinito-apk
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
